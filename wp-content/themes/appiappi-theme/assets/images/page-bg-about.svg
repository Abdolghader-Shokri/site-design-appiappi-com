<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="pageBgAboutTitle">
	<title id="pageBgAboutTitle">Decorative isometric illustration representing our team and company</title>
	<defs>
		<linearGradient id="aboutCubeTop" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#ffffff"/>
			<stop offset="100%" stop-color="#dbe6ff"/>
		</linearGradient>
	</defs>

	<ellipse cx="500" cy="205" rx="72" ry="10" fill="#10151d" opacity="0.07"/>
	<ellipse cx="415" cy="135" rx="42" ry="7" fill="#10151d" opacity="0.05"/>
	<ellipse cx="565" cy="212" rx="38" ry="7" fill="#10151d" opacity="0.05"/>

	<circle cx="360" cy="52" r="13" fill="none" stroke="#1e5eff" stroke-width="3" opacity="0.3"/>
	<circle cx="605" cy="42" r="6" fill="#d5222b" opacity="0.55"/>
	<circle cx="345" cy="150" r="4" fill="#1e5eff" opacity="0.3"/>

	<!-- main cube: our team -->
	<polygon points="500,130 560,100 560,160 500,190" fill="#1746c4"/>
	<polygon points="440,100 500,130 500,190 440,160" fill="#1e5eff"/>
	<polygon points="500,70 560,100 500,130 440,100" fill="url(#aboutCubeTop)"/>
	<g transform="translate(479,109) scale(1.05)" stroke="#0b1526" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
		<circle cx="9" cy="8" r="3"></circle>
		<path d="M4 20c0-3 2-5 5-5s5 2 5 5"></path>
		<circle cx="16.5" cy="9" r="2.4"></circle>
		<path d="M14.5 20c0-2.3 1-4.1 3-4.6"></path>
	</g>

	<!-- small cube upper-left: our company (home) -->
	<polygon points="415,85 453,66 453,104 415,123" fill="#1746c4"/>
	<polygon points="377,66 415,85 415,123 377,104" fill="#1e5eff"/>
	<polygon points="415,47 453,66 415,85 377,66" fill="url(#aboutCubeTop)"/>
	<g transform="translate(400,60) scale(0.85)" stroke="#0b1526" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
		<path d="M4 11l8-7 8 7"></path>
		<path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"></path>
	</g>

	<!-- small cube lower-right: our values (heart) -->
	<polygon points="565,168 599,151 599,185 565,202" fill="#1746c4"/>
	<polygon points="531,151 565,168 565,202 531,185" fill="#1e5eff"/>
	<polygon points="565,134 599,151 565,168 531,151" fill="url(#aboutCubeTop)"/>
	<g transform="translate(550,142) scale(0.8)" stroke="#0b1526" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
		<path d="M12 20s-7-4.5-9.5-9A5 5 0 0 1 12 6a5 5 0 0 1 9.5 5c-2.5 4.5-9.5 9-9.5 9z"></path>
	</g>
</svg>
