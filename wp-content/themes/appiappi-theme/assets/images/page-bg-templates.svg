<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="pageBgTemplatesTitle">
	<title id="pageBgTemplatesTitle">Decorative isometric illustration representing browsable website designs</title>
	<defs>
		<linearGradient id="tplCubeTop" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#ffffff"/>
			<stop offset="100%" stop-color="#dbe6ff"/>
		</linearGradient>
	</defs>

	<ellipse cx="500" cy="205" rx="72" ry="10" fill="#10151d" opacity="0.07"/>
	<ellipse cx="415" cy="135" rx="42" ry="7" fill="#10151d" opacity="0.05"/>
	<ellipse cx="565" cy="212" rx="38" ry="7" fill="#10151d" opacity="0.05"/>

	<circle cx="360" cy="52" r="13" fill="none" stroke="#1e5eff" stroke-width="3" opacity="0.3"/>
	<circle cx="605" cy="42" r="6" fill="#d5222b" opacity="0.55"/>
	<circle cx="345" cy="150" r="4" fill="#1e5eff" opacity="0.3"/>

	<!-- main cube: a website design (monitor) -->
	<polygon points="500,130 560,100 560,160 500,190" fill="#1746c4"/>
	<polygon points="440,100 500,130 500,190 440,160" fill="#1e5eff"/>
	<polygon points="500,70 560,100 500,130 440,100" fill="url(#tplCubeTop)"/>
	<g transform="translate(478,108) scale(1.15)" stroke="#0b1526" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
		<rect x="3" y="4" width="18" height="12" rx="2"></rect>
		<line x1="8" y1="20" x2="16" y2="20"></line>
		<line x1="12" y1="16" x2="12" y2="20"></line>
	</g>

	<!-- small cube upper-left: built with real code -->
	<polygon points="415,85 453,66 453,104 415,123" fill="#1746c4"/>
	<polygon points="377,66 415,85 415,123 377,104" fill="#1e5eff"/>
	<polygon points="415,47 453,66 415,85 377,66" fill="url(#tplCubeTop)"/>
	<g transform="translate(400,60) scale(0.85)" stroke="#0b1526" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
		<polyline points="16 18 22 12 16 6"></polyline>
		<polyline points="8 6 2 12 8 18"></polyline>
	</g>

	<!-- small cube lower-right: built to perform -->
	<polygon points="565,168 599,151 599,185 565,202" fill="#1746c4"/>
	<polygon points="531,151 565,168 565,202 531,185" fill="#1e5eff"/>
	<polygon points="565,134 599,151 565,168 531,151" fill="url(#tplCubeTop)"/>
	<g transform="translate(550,142) scale(0.8)" stroke="#0b1526" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
		<polyline points="3 17 9 11 13 15 21 6"></polyline>
		<polyline points="15 6 21 6 21 12"></polyline>
	</g>
</svg>
