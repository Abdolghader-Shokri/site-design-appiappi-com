<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="pageBgContactTitle">
	<title id="pageBgContactTitle">Decorative isometric illustration representing contact and communication</title>
	<defs>
		<linearGradient id="contactCubeTop" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#ffffff"/>
			<stop offset="100%" stop-color="#dbe6ff"/>
		</linearGradient>
	</defs>

	<ellipse cx="500" cy="205" rx="72" ry="10" fill="#10151d" opacity="0.07"/>
	<ellipse cx="415" cy="135" rx="42" ry="7" fill="#10151d" opacity="0.05"/>
	<ellipse cx="565" cy="212" rx="38" ry="7" fill="#10151d" opacity="0.05"/>

	<circle cx="360" cy="52" r="13" fill="none" stroke="#1e5eff" stroke-width="3" opacity="0.3"/>
	<circle cx="605" cy="42" r="6" fill="#d5222b" opacity="0.55"/>
	<circle cx="345" cy="150" r="4" fill="#1e5eff" opacity="0.3"/>

	<!-- main cube: send a message -->
	<polygon points="500,130 560,100 560,160 500,190" fill="#1746c4"/>
	<polygon points="440,100 500,130 500,190 440,160" fill="#1e5eff"/>
	<polygon points="500,70 560,100 500,130 440,100" fill="url(#contactCubeTop)"/>
	<g transform="translate(478,108) scale(1.15)" stroke="#0b1526" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
		<rect x="3" y="5" width="18" height="14" rx="2"></rect>
		<polyline points="3 7 12 13 21 7"></polyline>
	</g>

	<!-- small cube upper-left: find us (map pin) -->
	<polygon points="415,85 453,66 453,104 415,123" fill="#1746c4"/>
	<polygon points="377,66 415,85 415,123 377,104" fill="#1e5eff"/>
	<polygon points="415,47 453,66 415,85 377,66" fill="url(#contactCubeTop)"/>
	<g transform="translate(400,60) scale(0.85)" stroke="#0b1526" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
		<path d="M12 22s7-7.4 7-12a7 7 0 1 0-14 0c0 4.6 7 12 7 12z"></path>
		<circle cx="12" cy="10" r="2.5"></circle>
	</g>

	<!-- small cube lower-right: call us (phone) -->
	<polygon points="565,168 599,151 599,185 565,202" fill="#1746c4"/>
	<polygon points="531,151 565,168 565,202 531,185" fill="#1e5eff"/>
	<polygon points="565,134 599,151 565,168 531,151" fill="url(#contactCubeTop)"/>
	<g transform="translate(553,145) scale(0.75)" stroke="#0b1526" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
		<rect x="7" y="2" width="10" height="20" rx="2"></rect>
		<line x1="11" y1="18" x2="13" y2="18"></line>
	</g>
</svg>
